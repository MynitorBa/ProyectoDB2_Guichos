# Control de acceso de Redis (Entrega final). Una regla por usuario, sin contraseñas:
# iniciar-redis.sh agrega a cada usuario la contraseña de su variable de entorno.
#
#   ~patrón   llaves a las que puede acceder      &*    canales pub/sub (ninguno usa)
#   -@all     empieza sin ningún comando           +cmd  agrega un comando concreto
#
# Quien se conecta solo con contraseña (sin usuario) entra como «default»: solo lectura,
# con la contraseña de lectura. Lo usa Redis Commander (su imagen no admite usuario).
# Sin contraseña no entra nadie.
user default on resetkeys ~* resetchannels -@all +@read +@connection +info +scan +type -keys

# Backend (API y sus workers): solo las llaves de la tienda y solo los comandos que usa
# el código, incluidos los que corren dentro de los scripts Lua de las ventas flash.
# Sin KEYS, FLUSHALL, CONFIG, ACL, DEBUG, SHUTDOWN ni comandos de administración.
user tiendaya_api on resetkeys ~carrito:* ~flash:* ~autocompletar:* ~cola_pedidos:* ~respaldo:lectura:* ~similares:* ~vector_consulta:* ~para_ti:* ~vistos:* resetchannels -@all +ping +hello +client|setinfo +client|setname +multi +exec +discard +get +set +del +exists +expire +ttl +rename +scan +hset +hget +hgetall +hvals +hmget +hdel +hincrby +zadd +zrem +zrangebyscore +zrangebylex +lpush +rpush +lrange +lrem +ltrim +lindex +llen +eval

# Diagnóstico y Redis Commander: lee todo, no escribe ni borra nada.
user tiendaya_lectura on resetkeys ~* resetchannels -@all +@read +@connection +info +scan +type -keys

# Operación (instalación, reinicio de datos, revisar permisos): todo.
user tiendaya_admin on resetkeys ~* &* +@all
