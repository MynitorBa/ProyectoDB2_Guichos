services:
  mysql:
    image: mysql:8.0
    container_name: tiendaya_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tiendaya}
      MYSQL_USER: ${MYSQL_USER:-tiendaya}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-tiendaya123}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/mysql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/mysql/02_indexes.sql:/docker-entrypoint-initdb.d/02_indexes.sql:ro
      - ./database/mysql/03_procedures.sql:/docker-entrypoint-initdb.d/03_procedures.sql:ro
      - ./database/mysql/04_seed.sql:/docker-entrypoint-initdb.d/04_seed.sql:ro
      - ./database/mysql/05_phase1_integrity.sql:/docker-entrypoint-initdb.d/05_phase1_integrity.sql:ro
      - ./database/mysql/06_phase2_additive.sql:/docker-entrypoint-initdb.d/06_phase2_additive.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password

  mongo:
    image: mongo:7.0
    container_name: tiendaya_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-adminpassword}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-tiendaya}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./database/mongo/01_init_collections.js:/docker-entrypoint-initdb.d/01_init_collections.js:ro
      - ./database/mongo/02_indexes.js:/docker-entrypoint-initdb.d/02_indexes.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7.2-alpine
    container_name: tiendaya_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --save 60 1 --loglevel warning

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: tiendaya_redis_commander
    restart: unless-stopped
    ports:
      - "8082:8081"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOSTS: local:redis:6379

  cassandra:
    image: cassandra:4.1.12
    container_name: tiendaya_cassandra
    restart: unless-stopped
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: TiendaYa Analytics
      CASSANDRA_DC: datacenter1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'SELECT release_version FROM system.local' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 60s

  adminer:
    image: adminer:4
    container_name: tiendaya_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: mysql

  mongo-express:
    image: mongo-express:1
    container_name: tiendaya_mongo_express
    restart: unless-stopped
    ports:
      - "8081:8081"
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USER:-admin}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD:-adminpassword}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-adminpassword}@mongo:27017/
      ME_CONFIG_BASICAUTH: false

volumes:
  mysql_data:
  mongo_data:
  redis_data:
  cassandra_data:
